name: GitHub Metrics

on:
  schedule:
    # 06:23 no horário de Brasília (UTC-3)
    - cron: "23 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml

concurrency:
  group: github-metrics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  github-metrics:
    name: Atualizar estatísticas do perfil
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Gerar e salvar o painel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: Hangell

          filename: github-metrics.svg
          output_action: commit
          output_condition: data-changed
          plugins_errors_fatal: yes

          template: classic
          config_timezone: America/Sao_Paulo
          config_display: large

          # Estatísticas gerais
          base: header, activity, community, repositories
          base_indepth: yes

          # Repositórios considerados
          repositories_affiliations: owner, collaborator, organization_member

          # Linguagens de programação
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage

          # Calendário anual
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Pull requests e issues criados pelo usuário
          plugin_followup: yes
          plugin_followup_sections: user
